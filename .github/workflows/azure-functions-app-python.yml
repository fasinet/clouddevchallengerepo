name: Deploy Python Azure Function App

on:
  push:
    branches:
      - main
permissions:
  id-token: write
  contents: read

env:
  AZURE_FUNCTIONAPP_NAME: visitorcount01
  AZURE_FUNCTIONAPP_PACKAGE_PATH: .
  PYTHON_VERSION: '3.12'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
    - name: Install dependencies for testing
      run: |
       python -m pip install --upgrade pip
       pip install -r requirements.txt

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt --target=".python_packages/lib/site-packages"

    - name: Install Azure Functions Core Tools
      run: |
        npm install -g azure-functions-core-tools@4 --unsafe-perm true
    - name: Run backend tests
      run: |
        pip install pytest
        pytest Tests/

    - name: 'Login via OIDC'
      uses: azure/login@v1
      with:
        client-id: 80a50c0b-bb5e-468b-bf30-7af2cd67499a
        tenant-id: 3517143e-db93-4b8b-b4dd-10aaecce0e99
        subscription-id: 232bd906-0e1c-493b-8366-84c33e046d95
    - name: Deploy to Azure Function App
      run: |
        func azure functionapp publish ${{ env.AZURE_FUNCTIONAPP_NAME }}
